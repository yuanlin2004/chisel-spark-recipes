recipe_version: "2"
model: Qwen/Qwen3.8-27B-FP8
runtime: vllm
container: vllm/vllm-openai:v0.31.0

metadata:
  description: >-
    Qwen3.8-27B-FP8 with its built-in MTP head (4 draft tokens) and Chisel's reduced-vocabulary
    draft head; ~23 tok/s single-user decode on one DGX Spark, task scores 99.4-101.7% of BF16.
    Results and method: results/qwen3.8-27b/fp8-mtp4-draftvocab/

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  pipeline_parallel: 1
  gpu_memory_utilization: 0.8
  max_model_len: 81920
  max_num_batched_tokens: 16384
  kv_cache_dtype: fp8
  attention_backend: flashinfer
  tool_call_parser: qwen3_coder
  reasoning_parser: qwen3
  speculative_config: '{"method": "mtp", "num_speculative_tokens": 4}'
  additional_config: '{"chisel_draft_vocab": "qwen3.8-27b"}'
  chisel_draftvocab: "chisel-draftvocab @ git+https://github.com/yuanlin2004/chisel-spark-recipes@qwen3.8-27b-v1#subdirectory=plugin"

pre_exec:
  - "pip install --no-deps '{chisel_draftvocab}'"

command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser} \
    --kv-cache-dtype {kv_cache_dtype} \
    --attention-backend {attention_backend} \
    --speculative-config '{speculative_config}' \
    --additional-config '{additional_config}' \
    --enable-prefix-caching \
    -tp {tensor_parallel} \
    -pp {pipeline_parallel}
