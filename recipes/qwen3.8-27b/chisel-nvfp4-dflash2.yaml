recipe_version: "2"
model: unsloth/Qwen3.8-27B-NVFP4
runtime: vllm
# The spark-arena vLLM nightly image (vLLM 0.31.1rc1.dev380), pinned to the digest it was measured on.
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly@sha256:b77010699ec42ab88b3409f4dd101f2288dfd8895e2778e5bb737e03a20953f0

metadata:
  description: >-
    Chisel: Qwen3.8-27B NVFP4 (unsloth) with DFlash2 speculative decoding, 10 draft tokens,
    Chisel's NVFP4 drafter (yuanlin2004/Qwen3.8-27B-Chisel-DFlash2-NVFP4-drafter) and the
    linear-attention state cached in BF16; one DGX Spark. Task scores 99.3-103.9% of BF16
    (gsm8k, ifeval, humaneval, NarrativeQA). Recipe, results and method: https://github.com/yuanlin2004/chisel-spark-recipes

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  pipeline_parallel: 1
  gpu_memory_utilization: 0.6
  max_model_len: 262144
  max_num_batched_tokens: 16384
  max_num_seqs: 4
  reasoning_parser: qwen3
  tool_call_parser: qwen3_coder
  num_speculative_tokens: 10
  mamba_ssm_cache_dtype: bfloat16

command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    -tp {tensor_parallel} \
    -pp {pipeline_parallel} \
    --trust-remote-code \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --enable-chunked-prefill \
    --skip-mm-profiling \
    --limit-mm-per-prompt '{"image":0,"video":0}' \
    --reasoning-parser {reasoning_parser} \
    --tool-call-parser {tool_call_parser} \
    --enable-auto-tool-choice \
    --generation-config auto \
    --speculative-config '{"method":"dflash","model":"yuanlin2004/Qwen3.8-27B-Chisel-DFlash2-NVFP4-drafter","num_speculative_tokens":{num_speculative_tokens}}' \
    --default-chat-template-kwargs '{"enable_thinking":true,"reasoning_effort":"medium"}' \
    --mamba-ssm-cache-dtype {mamba_ssm_cache_dtype}
