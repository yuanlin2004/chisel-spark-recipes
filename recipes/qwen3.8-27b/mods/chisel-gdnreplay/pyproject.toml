[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chisel-gdnreplay"
version = "0.1.0"
description = "Chisel: GDN state replay for speculative decoding in vLLM (lossless; Qwen3.5/3.8 linear-attention layers)"
license = "Apache-2.0"
requires-python = ">=3.10"

[project.entry-points."vllm.general_plugins"]
chisel_gdnreplay = "chisel_gdnreplay:register"

[tool.setuptools]
packages = ["chisel_gdnreplay"]
